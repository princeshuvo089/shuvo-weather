<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHUVO WEATHER | Official Satellite Radar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-cyan: #00f2fe;
      --primary-blue: #4facfe;
      --glow-purple: #8a2387;
      --card-bg: rgba(16, 20, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #12072b, #090c19 60%, #030408);
      position: relative;
      overflow-x: hidden;
      padding: 25px 15px;
    }

    .glow-orb-1 {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(138, 35, 135, 0.45) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      filter: blur(80px);
      z-index: 1;
      animation: pulseGlow 10s infinite alternate;
    }

    .glow-orb-2 {
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      filter: blur(90px);
      z-index: 1;
      animation: pulseGlow 12s infinite alternate-reverse;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(30px, 30px); }
    }

    .weather-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.25),
        0 30px 70px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .weather-card {
        max-width: 460px;
        padding: 26px;
      }
    }

    .banner-container {
      position: relative;
      width: 100%;
      height: 110px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(9, 12, 25, 0.85) 100%);
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .official-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      object-fit: cover;
      border: 1.5px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .brand-text h2 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .live-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.35);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-cyan);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--primary-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary-cyan);
      animation: pulseDot 1.6s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.7); opacity: 0.4; }
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 25px;
      padding: 5px 6px 5px 16px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box button {
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
      border: none;
      outline: none;
      color: #050a1b;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }

    .error-msg {
      display: none;
      background: rgba(233, 64, 87, 0.18);
      border: 1px solid rgba(233, 64, 87, 0.35);
      padding: 9px;
      border-radius: 12px;
      color: #ff8597;
      font-size: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .weather-hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .city-name {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
    }

    .date {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .weather-visual {
      display: inline-block;
      margin: 6px 0;
    }

    .weather-icon {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 12px 20px rgba(0, 242, 254, 0.3));
    }

    .temp-display {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .temp {
      font-size: clamp(3.6rem, 11vw, 4.4rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .degree {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-cyan);
      margin-left: 3px;
    }

    .condition {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: capitalize;
      margin-top: 6px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .metric-icon {
      font-size: 20px;
      background: rgba(255, 255, 255, 0.07);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .metric-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .metric-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="weather-card">
    
    <div class="banner-container">
      <img src="https://cdn.imgchest.com/files/8897f212f6bd.jpg" alt="Shuvo Weather Banner" class="banner-img">
      <div class="banner-overlay"></div>
    </div>

    <div class="brand-header">
      <div class="brand-left">
        <img src="https://cdn.imgchest.com/files/e306f47acc89.jpg" alt="Shuvo Weather Logo" class="official-logo">
        <div class="brand-text">
          <h2>SHUVO WEATHER</h2>
          <p>Official Meteorological System</p>
        </div>
      </div>
      <div class="live-chip">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="যেকোনো শহর (যেমন: Kurigram, Dhaka)..." autocomplete="off">
      <button id="searchBtn">অনুসন্ধান</button>
    </div>

    <div class="error-msg" id="errorMsg">
      ⚠️ শহরটি খুঁজে পাওয়া যায়নি! সঠিক বানান লিখে আবার চেষ্টা করুন।
    </div>

    <div class="weather-hero">
      <h1 class="city-name" id="cityName">Kurigram, BD</h1>
      <p class="date" id="date">রিয়েল-টাইম স্যাটেলাইট উপাত্ত</p>

      <div class="weather-visual">
        <img src="https://openweathermap.org/img/wn/02d@4x.png" id="weatherIcon" alt="Weather" class="weather-icon">
      </div>

      <div class="temp-display">
        <span class="temp" id="temp">--</span>
        <span class="degree">°C</span>
      </div>

      <p class="condition" id="condition">লোড হচ্ছে...</p>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon">💨</div>
        <div class="metric-info">
          <span class="metric-label">বাতাসের গতি</span>
          <span class="metric-value" id="windSpeed">-- km/h</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">💧</div>
        <div class="metric-info">
          <span class="metric-label">আর্দ্রতা</span>
          <span class="metric-value" id="humidity">--%</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">🌡️</div>
        <div class="metric-info">
          <span class="metric-label">অনুভূত (Feels)</span>
          <span class="metric-value" id="feelsLike">--°C</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">👁️</div>
        <div class="metric-info">
          <span class="metric-label">বায়ুচাপ</span>
          <span class="metric-value" id="visibility">-- hPa</span>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
